<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mu+Ch</title>
<style>
  :root{
    --bg:#1a1a1f;
    --card:#242429;
    --ink:#eeeeee;
    --ink-soft:#a9a9b0;
    --accent:#54545c;
    --line:#3a3a41;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px 48px;
    min-height:100vh;
  }
  .logo{
    width:180px;
    max-width:60vw;
    margin-bottom:8px;
    filter:invert(1);
  }
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:36px;
    text-align:center;
  }
  .links{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color 0.15s ease, transform 0.1s ease;
  }
  .link-card:active{
    transform:scale(0.98);
  }
  .link-card:hover{
    border-color:var(--ink-soft);
  }
  .icon{
    flex:0 0 auto;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{
    width:22px;
    height:22px;
    stroke:var(--ink);
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon svg.filled{
    fill:var(--ink);
    stroke:none;
  }
  .text-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .text-block .title{
    font-size:15px;
    font-weight:700;
  }
  .text-block .sub{
    font-size:12px;
    color:var(--ink-soft);
  }
  footer{
    margin-top:40px;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
